<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Employee Management System</h2>

    <!-- Add Employee Form -->
    <div class="card mt-4 p-4 shadow-sm">
        <h4>Add New Employee</h4>
        <form action="#" th:action="@{/employees}" th:object="${employee}" method="POST" class="mt-3">
            <div class="mb-3">
                <label class="form-label">Full Name:</label>
                <input type="text" th:field="*{fullName}" class="form-control" />
                <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" />
                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone:</label>
                <input type="text" th:field="*{phone}" class="form-control" />
                <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Department:</label>
                <input type="text" th:field="*{department}" class="form-control" />
            </div>
            <div class="mb-3">
                <label class="form-label">Salary:</label>
                <input type="number" step="any" th:field="*{salary}" class="form-control" />
                <div class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
            </div>
            <button type="submit" class="btn btn-success">Save Employee</button>
        </form>
    </div>

    <!-- Employee Table -->
    <h4 class="mt-5">Employee List</h4>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${listEmployees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.fullName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>
                <td>
                    <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-primary btn-sm">Edit</a>
                    <form action="#" th:action="@{/employees/{id}/delete(id=${emp.id})}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
