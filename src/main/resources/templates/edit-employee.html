<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Edit Employee</h2>

    <div class="card mt-4 p-4 shadow-sm">
        <form action="#" th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name:</label>
                <input type="text" th:field="*{fullName}" class="form-control" />
            </div>
            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" />
            </div>
            <div class="mb-3">
                <label class="form-label">Phone:</label>
                <input type="text" th:field="*{phone}" class="form-control" />
            </div>
            <div class="mb-3">
                <label class="form-label">Department:</label>
                <input type="text" th:field="*{department}" class="form-control" />
            </div>
            <div class="mb-3">
                <label class="form-label">Salary:</label>
                <input type="number" step="any" th:field="*{salary}" class="form-control" />
            </div>
            <button type="submit" class="btn btn-primary">Update Employee</button>
            <a href="/employees" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
